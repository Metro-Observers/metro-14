  name: ключ
  description: Этот ключ может открыть дверь, а может и нет. Вы не знаете.
  abstract: true
  components:
  - type: Sprite
    sprite: _Metro14/Objects/Misc/key.rsi
    state: icon
  - type: Clothing
    slots:
    - idcard
  - type: Item
    size: Small
    heldPrefix: default
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - M14Key

